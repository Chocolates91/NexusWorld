<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: herramienta a pantalla completa — barra superior, catálogo a la izquierda, planta + 3D en el centro, ficha del mueble a la derecha. En móvil, una vista y hojas inferiores. */
:root{
  --bg:#eceae6; --panel:#f7f6f3; --panel-2:#efede9; --line:#d9d5ce; --ink:#23232a; --ink-2:#5d5b60; --ink-3:#8b8890;
  --accent:#2f56c9; --accent-ink:#ffffff; --accent-soft:rgba(47,86,201,.12);
  --warn:#c98a10; --danger:#cf3b30; --ok:#3b8a55;
  --paper:#e4e1dc; --wall:#2a2a31; --wood:#d8cbb9; --wood-line:rgba(120,96,70,.10); --tile:#dcd6cc; --bath:#eceae6; --ext:#cfc7ba;
  --glass:#7fb2d9; --fix:#f4f3f0; --fix-line:#8d8a86; --label:#3a3940; --dim:#2f56c9;
  --font-ui:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17171b; --panel:#202026; --panel-2:#26262d; --line:#34343c; --ink:#ecebef; --ink-2:#adabb4; --ink-3:#7c7a84;
  --accent:#7d9bff; --accent-ink:#0f1222; --accent-soft:rgba(125,155,255,.16);
  --warn:#e7ad3c; --danger:#ff6b5e; --ok:#6cc58b;
  --paper:#1c1c21; --wall:#d9d7dd; --wood:#4a4339; --wood-line:rgba(255,240,220,.06); --tile:#3d3a35; --bath:#3a3a3d; --ext:#34312c;
  --glass:#6fa6d6; --fix:#2c2c33; --fix-line:#8f8c96; --label:#e2e0e6; --dim:#7d9bff;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#17171b; --panel:#202026; --panel-2:#26262d; --line:#34343c; --ink:#ecebef; --ink-2:#adabb4; --ink-3:#7c7a84;
  --accent:#7d9bff; --accent-ink:#0f1222; --accent-soft:rgba(125,155,255,.16);
  --warn:#e7ad3c; --danger:#ff6b5e; --ok:#6cc58b;
  --paper:#1c1c21; --wall:#d9d7dd; --wood:#4a4339; --wood-line:rgba(255,240,220,.06); --tile:#3d3a35; --bath:#3a3a3d; --ext:#34312c;
  --glass:#6fa6d6; --fix:#2c2c33; --fix-line:#8f8c96; --label:#e2e0e6; --dim:#7d9bff;
  color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:5}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--ink-3);font-family:var(--font-mono)}
.spacer{flex:1}
.group{display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.icon{padding:6px 8px;min-width:32px;justify-content:center}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--danger)}
select.btn{padding-right:24px;appearance:auto;max-width:220px}
.status{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block}
.status.ok i{background:var(--ok)} .status.busy i{background:var(--warn)} .status.err i{background:var(--danger)}
.stage{flex:1;display:grid;grid-template-columns:248px minmax(0,1fr) 272px;min-height:0}
.catalog,.inspector{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.catalog{border-right:1px solid var(--line)}
.inspector{border-left:1px solid var(--line)}
.pane-h{padding:12px 14px 8px;display:flex;align-items:center;gap:8px}
.pane-h h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;margin:0}
.search{margin:0 14px 8px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:7px 10px}
.cat-list{overflow:auto;padding:0 8px 16px;flex:1}
.cat-list h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:14px 6px 6px;font-weight:600}
.cat-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:6px;border-radius:8px}
.cat-item:hover{background:var(--panel-2)}
.cat-item canvas{width:40px;height:30px;flex:none}
.cat-item .t{display:flex;flex-direction:column;min-width:0}
.cat-item .t b{font-weight:500;font-size:13px}
.cat-item .t small{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.views{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:0;min-width:0}
.views[data-view="2d"]{grid-template-columns:1fr}
.views[data-view="3d"]{grid-template-columns:1fr}
.views[data-view="2d"] #v3d,.views[data-view="3d"] #v2d{display:none}
.view{position:relative;min-height:0;min-width:0;overflow:hidden}
#v2d{background:var(--paper)}
#v3d{border-left:1px solid var(--line);background:var(--paper)}
.views[data-view="3d"] #v3d{border-left:0}
#c2d{display:block;width:100%;height:100%;touch-action:none;cursor:default}
#c3d{position:absolute;inset:0}
#c3d canvas{display:block;touch-action:none}
.vlabel{position:absolute;top:10px;left:12px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;pointer-events:none}
.tools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.tools .btn{background:var(--panel)}
.tools .btn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--ink-3);pointer-events:none;max-width:calc(100% - 24px)}
.walkpad{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:6px}
.walkpad .btn{justify-content:center;font-size:16px;background:var(--panel)}
.walkpad .up{grid-column:2;grid-row:1}.walkpad .l{grid-column:1;grid-row:2}.walkpad .dn{grid-column:2;grid-row:2}.walkpad .r{grid-column:3;grid-row:2}
.ins-body{overflow:auto;padding:0 14px 16px;display:flex;flex-direction:column;gap:14px;flex:1}
.empty{color:var(--ink-3);font-size:13px;line-height:1.5}
.empty b{color:var(--ink-2);font-weight:600}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.field input[type=text]{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:7px 9px}
.dims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.dims div{display:flex;flex-direction:column;gap:3px;min-width:0}
.dims span{font-size:11px;color:var(--ink-3)}
.field > input[type=number]{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:7px 8px;font-family:var(--font-mono);font-size:13px;width:100%}
.dims input{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:7px 8px;font-family:var(--font-mono);font-size:13px;width:100%;min-width:0}
.row{display:flex;gap:6px;flex-wrap:wrap}
.rotrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rotrow .btn{padding:6px 2px;justify-content:center;font-size:12.5px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.flag{font-size:12.5px;padding:8px 10px;border-radius:8px;line-height:1.4}
.flag.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--ink)}
.flag.bad{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--ink)}
.flag.good{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ink)}
.kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--ink-2)}
.menu{position:absolute;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:220px;display:flex;flex-direction:column}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px}
.menu button:hover{background:var(--panel-2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .confirm{padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.rename{display:flex;gap:6px}
.rename input{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 9px;width:180px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-2)}
.legend div{display:flex;gap:8px;align-items:center}
.legend i{width:16px;height:10px;border-radius:2px;display:inline-block;flex:none}
.mobile-only{display:none}
.sheet-close{display:none}
@media (max-width: 1100px){ .stage{grid-template-columns:220px minmax(0,1fr) 240px} }
@media (max-width: 860px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .catalog,.inspector{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:62%;border:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -12px 32px rgba(0,0,0,.2);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);transform:translateY(105%);transition:transform .22s ease}
  .catalog.open,.inspector.open{transform:none}
  .inspector{max-height:52%}
  .inspector .ins-body{gap:10px}
  .inspector .note{display:none}
  .views{grid-template-columns:1fr !important}
  .views[data-view="both"] #v3d{display:none}
  #v3d{border-left:0}
  .mobile-only{display:inline-flex}
  .desk-only{display:none !important}
  .sheet-close{display:inline-flex;margin-left:auto}
  .fab{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .bar{gap:8px}
  .brand span{display:none}
  select.btn{max-width:150px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>

<div id="app">

          <button class="btn" id="btnWalk" aria-pressed="false" title="Recorrer el piso a la altura de los ojos">Recorrer</button>
          <button class="btn" id="btnHome" title="Volver a la vista general">Vista general</button>
          <button class="btn" id="btnMood" title="Cambiar luz y colores de paredes">Ambiente: Dune</button>
          <button class="btn" id="btnLights" aria-pressed="true" title="Encender o apagar las lámparas">Luces: encendidas</button>
        </div>
        <div class="hint" id="hint3d">Arrastra para girar · rueda o pellizco para acercar · arrastra un mueble para moverlo</div>
        <div class="walkpad" id="walkpad" hidden>
          <button class="btn up" data-walk="f" aria-label="Avanzar">▲</button>
          <button class="btn l" data-walk="l" aria-label="Girar a la izquierda">↺</button>
          <button class="btn dn" data-walk="b" aria-label="Retroceder">▼</button>

        <button class="btn primary fab mobile-only" id="fabAdd3">＋ Añadir mueble</button>

      <div class="pane-h"><h2 id="insTitle">Mueble</h2><button class="btn icon sheet-close" data-close="inspector" aria-label="Cerrar">✕</button></div>
      <div class="ins-body" id="insBody"></div>
    </aside>
  </main>
</div>

   Extraída del plano vectorial del promotor (escala gráfica 5 m = 218 pt). */
const H = 2.55;           // altura libre estimada
const DOOR_H = 2.10;
const ARC_C = [1.92, 8.10], ARC_R = 1.95;
const arc = (a0, a1, n) => { const p=[]; for(let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; p.push([ARC_C[0]+ARC_R*Math.cos(a), ARC_C[1]+ARC_R*Math.sin(a)]);} return p; };

  [3.41,3.24,3.51,4.0],[0.25,3.28,1.95,3.36],[1.72,3.36,1.87,3.95],[1.72,3.87,3.41,3.95],
  // dormitorio 2 / dormitorio 1
  [3.41,4.92,3.51,6.5],[0.25,6.4,3.41,6.5],[3.51,5.19,3.56,5.29],[4.48,5.19,5.23,6.11],[4.54,6.11,4.64,6.22],
  // cocina
  [5.13,3.48,5.23,5.19],[5.13,6.11,5.23,8.0],[5.13,3.48,6.06,3.58],[6.96,3.48,7.6,3.58],[7.5,3.58,7.6,5.23],
  [7.04,5.23,7.6,5.33],[7.04,5.33,7.14,7.41],[7.04,7.41,7.6,8.23],
  // baño 1 y fachada sur
  [3.46,8.0,3.56,9.79],[4.46,8.0,5.83,8.09],[5.64,8.09,5.83,8.23],[5.64,8.23,5.91,8.85],[5.64,9.35,6.23,10.04],

].map(r => ({poly: rectPoly(r), h: H}));
// esquina curva: tramo macizo y tramo con ventanas
const P_SOLID = [[1.25,9.64],[1.6,9.75],[1.66,9.44],[2.36,9.44],[2.36,9.79],[3.46,9.79],[3.46,10.04],...arc(90,110,6)];
const P_WINBAND = [[0.25,8.21],[0.58,9.07],[1.25,9.64],...arc(110,180,14),[0,8.1],[0,8.21]];
WALLS.push({poly:P_SOLID,h:H});
const RAILING = {poly: rectPoly([6.23,9.94,10.42,10.04]), h:1.0};

const DOORS = [ // huecos de paso: [x0,y0,x1,y1]
  {r:[8.94,0.35,9.94,0.6], name:'Entrada', swing:{c:[9.94,0.6], r:0.92, a0:180, a1:90}},
  {r:[3.41,2.34,3.51,3.24], name:'Dormitorio 3', slide:true},
  {r:[3.56,2.19,4.46,2.29], name:'Baño 2', slide:true},
  {r:[7.44,0.6,7.54,2.16], name:'Cuarto de aguas', swing2:[{c:[7.54,0.62],r:0.76,a0:90,a1:0},{c:[7.54,2.16],r:0.76,a0:-90,a1:0}], closed:true},

function uid(){ return Math.random().toString(36).slice(2,9); }
const rad = a => a*Math.PI/180;

function itemPoly(it, pad=0){
  const c=Math.cos(rad(it.rot)), s=Math.sin(rad(it.rot)), hw=it.w/2+pad, hd=it.d/2+pad;
  return [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([x,y]) => [it.x + x*c - y*s, it.y + x*s + y*c]);
}
function localShape(it, pad=0){ const hw=it.w/2+pad, hd=it.d/2+pad; if(it.type!=='chaise') return [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]]; const sd=Math.min(0.95,it.d)+pad*2, cw=Math.min(0.85,it.w)+pad*2; let p=[[-hw,-hd],[hw,-hd],[hw,hd],[hw-cw,hd],[hw-cw,-hd+sd],[-hw,-hd+sd]]; if(it.flip) p=p.map(([x,y])=>[-x,y]).reverse(); return p; }
function itemShape(it, pad=0){ return it.type==='chaise' ? localShape(it,pad).map(([x,y])=>toWorld(it,x,y)) : itemPoly(it,pad); }
function toLocal(it, px, py){ const c=Math.cos(rad(it.rot)), s=Math.sin(rad(it.rot)), dx=px-it.x, dy=py-it.y; return [dx*c+dy*s, -dx*s+dy*c]; }
function toWorld(it, lx, ly){ const c=Math.cos(rad(it.rot)), s=Math.sin(rad(it.rot)); return [it.x + lx*c - ly*s, it.y + lx*s + ly*c]; }
function pip(pt, poly){ let ins=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const [xi,yi]=poly[i],[xj,yj]=poly[j]; if(((yi>pt[1])!==(yj>pt[1])) && (pt[0] < (xj-xi)*(pt[1]-yi)/(yj-yi)+xi)) ins=!ins; } return ins; }

function applyWalkCam(){ const dir=new THREE.Vector3(Math.sin(walk.yaw)*Math.cos(walk.pitch), Math.sin(walk.pitch), Math.cos(walk.yaw)*Math.cos(walk.pitch)); camera.lookAt(camera.position.clone().add(dir)); req3d(); }

  if (walk.target){ const dx=walk.target[0]-camera.position.x, dz=walk.target[1]-camera.position.z, dd=Math.hypot(dx,dz); if(dd<0.06) walk.target=null; else { const tyaw=Math.atan2(dx,dz); let diff=tyaw-walk.yaw; while(diff>Math.PI) diff-=2*Math.PI; while(diff<-Math.PI) diff+=2*Math.PI; walk.yaw+=diff*0.12; const step=Math.min(dd,0.06); const bx=camera.position.x, bz=camera.position.z; moveWalk(dx/dd*step, dz/dd*step); if(camera.position.x===bx && camera.position.z===bz) walk.target=null; } }

function addItem(def){
  if (state.readOnly) return;
  const [type,name,w,d,h,color,elev]=def; const prev=snapshot();
  // busca hueco libre: primero en el centro de lo que se ve, luego en cada estancia
  const sn=v=>+(Math.round(v/0.05)*0.05).toFixed(3);
  let [cx,cy] = S2W(view2.w/2, view2.h/2); if(!(view2.w>0) || !pip([cx,cy],FOOTPRINT)) { cx=8.9; cy=5.6; }
  const it={id:uid(), type, name, x:sn(cx), y:sn(cy), rot:0, w, d, h, color, ...(elev?{elev}:{})};
  const free=()=>{ const i=issuesFor(it,[...state.items,it]); return !(i.wall||i.fixed||i.items.length||i.outside); };
  const seeds=[[cx,cy], ...ROOMS.map(r=>r.p).sort((a,b)=>Math.hypot(a[0]-cx,a[1]-cy)-Math.hypot(b[0]-cx,b[1]-cy))];
  let ok=false;
  outer: for(const [sx,sy] of seeds){ for(const rot of [0,90]){ it.rot=rot; for(let r=0;r<1.6;r+=0.2){ for(let a=0;a<360;a+=r?30:360){ it.x=sn(sx+r*Math.cos(rad(a))); it.y=sn(sy+r*Math.sin(rad(a))); if(free()){ ok=true; break outer; } } } } }
  if(!ok){ it.rot=0; it.x=sn(cx); it.y=sn(cy); }
  state.items.push(it); commit(prev); sync3d(); select(it.id); if(isMobile()) closeSheet('catalog');
}

  const s=Math.min(34/w, 24/d);
  // dibuja con la misma rutina de la planta
  const fake={id:'_', type, name, x:0, y:0, rot:0, w, d, h, color};
  const old={...view2}, keep=g; view2.s=s; view2.ox=20; view2.oy=15; g=x;
  try { drawItem2d(fake,{thumb:true}); } finally { g=keep; Object.assign(view2,old); }
}

    title.textContent='Cómo funciona';
    if(light) return;
    const counts = state.items.filter(i=>{ const s=issuesFor(i,state.items); return s.wall||s.fixed||s.items.length||s.outside; }).length;
    body.innerHTML = `<p class="empty">Toca un mueble para <b>moverlo, girarlo o cambiar sus medidas</b>. Añade más desde el catálogo.</p>
      <div class="legend">
        <div><i style="background:var(--wall)"></i>Muros (del plano del promotor)</div>
        <div><i style="background:var(--glass)"></i>Ventanas y puertas a la terraza</div>
        <div><i style="border:2px solid var(--danger)"></i>Choca con un muro u otro mueble</div>
        <div><i style="border:2px dashed var(--warn)"></i>Invade el giro de una puerta</div>
        <div><i style="background:var(--fix);border:1px solid var(--fix-line)"></i>Fijo: cocina, baños, armarios empotrados</div>
      </div>
      ${counts?`<p class="flag bad">${counts} ${counts===1?'mueble choca':'muebles chocan'} con algo. Están marcados en rojo.</p>`:''}
      <p class="empty">Medidas de muros sacadas del plano a escala. La altura de techo (2,55 m) y la de las ventanas son estimadas.</p>`;
    return;
  }
  title.textContent='Mueble';
  const iss=issuesFor(it,state.items);
  if (light){ const f=body.querySelector('#issueBox'); if(f) f.outerHTML=issueHtml(iss); return; }
  body.innerHTML = `
    <div class="field"><label for="fName">Nombre</label><input id="fName" type="text" value=""></div>
    <div class="field"><label>Medidas (cm)</label><div class="dims">
      <div><span>Ancho</span><input id="fW" type="number" min="5" max="600" step="1"></div>
      <div><span>Fondo</span><input id="fD" type="number" min="5" max="600" step="1"></div>
      <div><span>Alto</span><input id="fH" type="number" min="1" max="${Math.round(H*100)}" step="1"></div></div></div>
    <div class="field"><label>Girar</label><div class="rotrow">
      <button class="btn" data-rot="-90">↺ 90°</button><button class="btn" data-rot="-15">↺ 15°</button><button class="btn" data-rot="15">↻ 15°</button><button class="btn" data-rot="90">↻ 90°</button></div></div>
    ${ONTOP.has(it.type)?'<div class="field"><label for="fE">Altura desde el suelo (cm)</label><input id="fE" type="number" min="0" max="240" step="1"></div>':''}
    ${FLIP.has(it.type)?'<button class="btn" id="bFlip">Dar la vuelta (espejo)</button>':''}
    <div class="field"><label>Color</label><div class="swatches" id="sw"></div></div>
    ${issueHtml(iss)}
    <div class="row"><button class="btn" id="bDup">Duplicar</button><button class="btn danger" id="bDel">Quitar</button></div>
    <p class="empty note" style="font-size:12px">Las líneas azules marcan la distancia libre hasta el muro o mueble más cercano.</p>`;
  const ro=state.readOnly;
  const fName=body.querySelector('#fName'); fName.value=it.name; fName.disabled=ro;
  const setNum=(id,v)=>{ const el=body.querySelector(id); el.value=Math.round(v*100); el.disabled=ro; return el; };
  const fW=setNum('#fW',it.w), fD=setNum('#fD',it.d), fH=setNum('#fH',it.h);
  const change=(fn)=>{ const prev=snapshot(); fn(); commit(prev); sync3d(); draw2d(); renderInspector(true); };
  fName.onchange=()=>change(()=>{ it.name=fName.value.trim()||it.name; });
  const numChange=(el,key,min)=>{ el.onchange=()=>{ const v=parseFloat(el.value); if(!isFinite(v)) { el.value=Math.round(it[key]*100); return; } change(()=>{ it[key]=Math.max(min,Math.min(key==='h'?H:6,v/100)); }); }; };
  numChange(fW,'w',0.05); numChange(fD,'d',0.05); numChange(fH,'h',0.01);
  const fE=body.querySelector('#fE'); if(fE){ fE.value=Math.round((it.elev||0)*100); fE.disabled=ro; fE.onchange=()=>{ const v=parseFloat(fE.value); if(!isFinite(v)){ fE.value=Math.round((it.elev||0)*100); return; } change(()=>{ it.elev=Math.max(0,Math.min(2.4,v/100)); }); }; }
  for(const b of body.querySelectorAll('[data-rot]')){ b.disabled=ro; b.onclick=()=>change(()=>{ it.rot=(((it.rot+ +b.dataset.rot)%360)+360)%360; }); }
  const sw=body.querySelector('#sw'); for(const c of PAL){ const b=document.createElement('button'); b.style.background=c; b.setAttribute('aria-label','Color '+c); b.setAttribute('aria-pressed', c.toLowerCase()===String(it.color).toLowerCase()); b.disabled=ro; b.onclick=()=>{ change(()=>{ it.color=c; }); renderInspector(); }; sw.appendChild(b); }
  const bf=body.querySelector('#bFlip'); if(bf){ bf.disabled=ro; bf.onclick=()=>change(()=>{ it.flip=!it.flip; }); }
  body.querySelector('#bDup').disabled=ro; body.querySelector('#bDel').disabled=ro;
  body.querySelector('#bDup').onclick=()=>{ const prev=snapshot(); const n={...clone(it), id:uid(), x:it.x+0.3, y:it.y+0.3}; state.items.push(n); commit(prev); sync3d(); select(n.id); };
  body.querySelector('#bDel').onclick=()=>deleteSel();
}
function issueHtml(iss){
  let html='';
  if (iss.outside) html=`<p class="flag bad">Se sale del piso.</p>`;
  else if (iss.wall) html=`<p class="flag bad">Choca con un muro o una ventana.</p>`;
  else if (iss.fixed) html=`<p class="flag bad">Choca con: ${esc(iss.fixed.name.toLowerCase())}.</p>`;
  else if (iss.items.length) html=`<p class="flag bad">Se pisa con: ${esc(iss.items.map(i=>i.name.toLowerCase()).slice(0,2).join(', '))}.</p>`;
  if (!html && iss.door) html=`<p class="flag warn">Invade el giro de la puerta de ${esc(iss.door.toLowerCase())}.</p>`;
  if (!html) html=`<p class="flag good">Cabe sin chocar con nada.</p>`;
  return `<div id="issueBox">${html}</div>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function deleteSel(){ if(state.readOnly) return; const prev=snapshot(); state.items=state.items.filter(i=>i.id!==state.sel); commit(prev); select(null); sync3d(); }
function rotateSel(by){ const it=state.items.find(i=>i.id===state.sel); if(!it||state.readOnly) return; const prev=snapshot(); it.rot=(((it.rot+by)%360)+360)%360; commit(prev); update3dItem(it); draw2d(); renderInspector(); }
function updateUndo(){ document.getElementById('undoBtn').disabled=!state.undo.length||state.readOnly; document.getElementById('redoBtn').disabled=!state.redo.length||state.readOnly; }
function undo(){ if(!state.undo.length) return; state.redo.push(snapshot()); state.items=state.undo.pop(); if(state.sel && !state.items.find(i=>i.id===state.sel)) state.sel=null; commit(null); renderAll(); }
function redo(){ if(!state.redo.length) return; state.undo.push(snapshot()); state.items=state.redo.pop(); commit(null); renderAll(); }
document.getElementById('undoBtn').onclick=undo; document.getElementById('redoBtn').onclick=redo;
window.addEventListener('keydown', e => {
  const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='select'||tag==='textarea') return;
  const k=e.key.toLowerCase();
  if (state.walk && ['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ walk.keys.add(k); e.preventDefault(); return; }
  if ((e.ctrlKey||e.metaKey) && k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if ((e.ctrlKey||e.metaKey) && k==='y'){ e.preventDefault(); redo(); return; }
  if (!state.sel) return;
  if (k==='delete'||k==='backspace'){ e.preventDefault(); deleteSel(); }
  else if (k==='r'){ rotateSel(e.shiftKey?-90:90); }
  else if (k==='escape'){ select(null); }
  else if (k.startsWith('arrow')){ e.preventDefault(); const it=state.items.find(i=>i.id===state.sel); if(!it||state.readOnly) return; const st=e.shiftKey?0.1:0.01; const prev=snapshot(); if(k==='arrowup') it.y-=st; if(k==='arrowdown') it.y+=st; if(k==='arrowleft') it.x-=st; if(k==='arrowright') it.x+=st; it.x=+it.x.toFixed(3); it.y=+it.y.toFixed(3); commit(prev); update3dItem(it); draw2d(); renderInspector(true); }
});
window.addEventListener('keyup', e => walk.keys.delete(e.key.toLowerCase()));

/* ───────────────────────── Propuestas ───────────────────────── */
const propSel=document.getElementById('propSel');
function renderProps(){ propSel.innerHTML=''; for(const p of state.props){ const o=document.createElement('option'); o.value=p.id; o.textContent=p.name; propSel.appendChild(o);} propSel.value=state.currentId||''; }
propSel.onchange=()=>{ state.currentId=propSel.value; loadCurrent(); };
let menuEl=null;
function closeMenu(){ if(menuEl){ menuEl.remove(); menuEl=null; } }
document.getElementById('propMenuBtn').onclick=(e)=>{ e.stopPropagation(); if(menuEl){ closeMenu(); return; } openPropMenu(); };
document.addEventListener('pointerdown', e => { if(menuEl && !menuEl.contains(e.target) && e.target.id!=='propMenuBtn') closeMenu(); });
function openPropMenu(view='main'){
  closeMenu(); const r=document.getElementById('propMenuBtn').getBoundingClientRect();
  menuEl=document.createElement('div'); menuEl.className='menu'; menuEl.style.top=(r.bottom+6)+'px'; menuEl.style.left=Math.max(8,Math.min(r.left, window.innerWidth-240))+'px';
  const ro=state.readOnly;
  if (view==='main'){
    menuEl.innerHTML=`<button data-a="new-s">Nueva: salón con estantería separadora</button><button data-a="new-b">Nueva: salón con acuario separador</button><button data-a="new-c">Nueva: celosía de listones</button><button data-a="new-e">Nueva: piso vacío</button><button data-a="dup">Duplicar esta propuesta</button><hr><button data-a="ren">Cambiar nombre</button><button data-a="del" class="danger" style="color:var(--danger)">Borrar esta propuesta</button>`;
    for(const b of menuEl.querySelectorAll('button')){ b.disabled=ro; b.onclick=()=>propAction(b.dataset.a); }
  } else if (view==='ren'){
    menuEl.innerHTML=`<div class="confirm"><label for="renIn">Nombre de la propuesta</label><div class="rename"><input id="renIn" type="text" maxlength="40"><button class="btn primary" id="renOk">Guardar</button></div></div>`;
    const inp=menuEl.querySelector('#renIn'); inp.value=currentProp().name; setTimeout(()=>inp.focus(),0);
    const ok=()=>{ const v=inp.value.trim(); if(v){ const p=currentProp(); p.name=v; p.items=clone(state.items); scheduleSave(p); renderProps(); } closeMenu(); };
    menuEl.querySelector('#renOk').onclick=ok; inp.onkeydown=(e)=>{ if(e.key==='Enter') ok(); if(e.key==='Escape') closeMenu(); };
  } else if (view==='del'){
    const only=state.props.length<=1;
    menuEl.innerHTML=`<div class="confirm"><span>${only?'Es la única propuesta. Se vaciará en vez de borrarse.':'¿Borrar «'+esc(currentProp().name)+'»? No se puede deshacer.'}</span><div class="row"><button class="btn" id="dNo">Cancelar</button><button class="btn danger" id="dYes">${only?'Vaciar':'Borrar'}</button></div></div>`;
    menuEl.querySelector('#dNo').onclick=closeMenu;
    menuEl.querySelector('#dYes').onclick=()=>{ if(only){ const prev=snapshot(); state.items=[]; commit(prev); renderAll(); } else { const id=state.currentId; state.props=state.props.filter(p=>p.id!==id); removeProp(id); state.currentId=state.props[0].id; loadCurrent(); lsSave(); } closeMenu(); };
  }
  document.body.appendChild(menuEl);
}
function propAction(a){
  if (a==='ren' || a==='del'){ openPropMenu(a); return; }
  const n=state.props.length+1; const items = a==='dup' ? clone(state.items).map(i=>({...i,id:uid()})) : template(a==='new-e'?'empty':(a==='new-b'?'B':(a==='new-c'?'C':'A')));
  const name = a==='dup' ? currentProp().name+' (copia)' : 'Propuesta '+n;
  const p={id:'p-'+uid(), name, items, createdAt:Date.now(), unsaved:store.mode==='db'}; state.props.push(p); state.currentId=p.id; scheduleSave(p); renderProps(); loadCurrent(); closeMenu();
}

/* ───────────────────────── Vistas ───────────────────────── */
function setView(v){ state.view=v; document.getElementById('views').dataset.view=v; for(const b of document.querySelectorAll('.seg button')) b.setAttribute('aria-pressed', b.dataset.view===v); lsPref('view',v); requestAnimationFrame(()=>{ resize2d(); resize3d(); fit2d(); }); }
for(const b of document.querySelectorAll('.seg button')) b.onclick=()=>setView(b.dataset.view);

function renderAll(){ renderProps(); renderInspector(); sync3d(); draw2d(); updateUndo(); }
new ResizeObserver(()=>{ const was=view2.w; resize2d(); resize3d(); if(!was) fit2d(); }).observe(document.getElementById('views'));
const mq=window.matchMedia('(prefers-color-scheme: dark)'); const onTheme=()=>{ readColors(); thumbsDirty(); draw2d(); updateSelRing(); req3d(); }; mq.addEventListener?.('change',onTheme); new MutationObserver(onTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function thumbsDirty(){ renderCatalog(); }

// arranque
readColors();
FONT_UI = cssVar('--font-ui'); FONT_MONO = cssVar('--font-mono');
document.fonts?.ready?.then(()=>{ draw2d(); renderCatalog(); });
const v0 = lsPref('view'); setView(isMobile() ? (v0==='3d'?'3d':'2d') : (v0||'both'));
state.mood = lsPref('mood')==='neutro' ? 'neutro' : 'dune'; state.lights = lsPref('lights')!=='off'; applyMood();
document.getElementById('btnLights').onclick=()=>{ state.lights=!state.lights; lsPref('lights', state.lights?'on':'off'); applyLights(); };
document.getElementById('btnMood').onclick=()=>{ state.mood = state.mood==='dune'?'neutro':'dune'; lsPref('mood',state.mood); applyMood(); };
buildArch(); renderCatalog(); renderInspector(); loop();
initStore();

</script>

</body></html>
